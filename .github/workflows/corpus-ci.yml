name: Corpus CI

on:
  pull_request:
    paths:
      - "apps/scut-senior/knowledge/**"
      - "tools/corpus/**"
      - "apps/scut-senior/worker/**"
      - "apps/scut-senior/packages/**"
      - "apps/scut-senior/tests/fixtures/**"
      - "apps/scut-senior/tests/python/test_corpus*.py"
      - "apps/scut-senior/tests/python/test_contract*.py"
      - "apps/scut-senior/tests/python/test_manifest*.py"
      - "apps/scut-senior/tests/python/test_locator*.py"
      - "apps/scut-senior/tests/python/test_schema*.py"
      - "apps/scut-senior/**/chunk*"
      - "apps/scut-senior/**/manifest*"
      - "apps/scut-senior/**/locator*"
      - "apps/scut-senior/**/schema*"
      - ".github/workflows/corpus-ci.yml"
  push:
    branches:
      - master
    paths:
      - "apps/scut-senior/knowledge/**"
      - "tools/corpus/**"
      - "apps/scut-senior/worker/**"
      - "apps/scut-senior/packages/**"
      - "apps/scut-senior/tests/fixtures/**"
      - "apps/scut-senior/tests/python/test_corpus*.py"
      - "apps/scut-senior/tests/python/test_contract*.py"
      - "apps/scut-senior/tests/python/test_manifest*.py"
      - "apps/scut-senior/tests/python/test_locator*.py"
      - "apps/scut-senior/tests/python/test_schema*.py"
      - "apps/scut-senior/**/chunk*"
      - "apps/scut-senior/**/manifest*"
      - "apps/scut-senior/**/locator*"
      - "apps/scut-senior/**/schema*"
      - ".github/workflows/corpus-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: corpus-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"
  # Manifest validation runs before the builder's clean-checkout gate.
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  fixture-compatibility:
    name: Real candidate and fixture compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v4 makes `filter` override `sparse-checkout`; keep the
      # sequence explicit so both boundaries are active before checkout.
      - name: Partial and sparse checkout of corpus inputs without LFS
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth=1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone -- \
            /apps/scut-senior/knowledge/ \
            /tools/corpus/ \
            /apps/scut-senior/worker/ \
            /apps/scut-senior/packages/ \
            /apps/scut-senior/tests/ \
            /.github/workflows/corpus-ci.yml
          git fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          test "$(git config --bool core.sparseCheckout)" = true
          test ! -e "学科资料"
          test ! -e apps/scut-senior/web
          test ! -e apps/scut-senior/api

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the corpus test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            ./apps/scut-senior/worker \
            'pytest>=8.4,<9' \
            'jsonschema>=4.25,<5'

      - name: Validate the repository manifest
        env:
          PYTHONPATH: apps/scut-senior/worker/src
        run: >-
          python -m scut_senior_worker.corpus_validator
          --manifest apps/scut-senior/knowledge/manifest.csv
          --knowledge-root apps/scut-senior/knowledge
          --pretty

      - name: Build and validate a real candidate without activation
        env:
          PYTHONPATH: apps/scut-senior/worker/src
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git ls-files -- 'active.json' ':(glob)**/active.json')" ]]; then
            echo "active.json must not be committed"
            exit 1
          fi

          store_root="$(mktemp -d "${RUNNER_TEMP}/scut-senior-corpus.XXXXXX")"
          source_commit="$(git rev-parse HEAD)"

          python -m scut_senior_worker.corpus_builder build \
            --manifest apps/scut-senior/knowledge/manifest.csv \
            --knowledge-root apps/scut-senior/knowledge \
            --store-root "${store_root}" \
            --source-commit "${source_commit}" \
            --repository-root .

          mapfile -t candidates < <(
            find "${store_root}/candidates" \
              -mindepth 1 -maxdepth 1 -type d -print
          )
          if [[ "${#candidates[@]}" -ne 1 ]]; then
            echo "expected exactly one generated candidate"
            exit 1
          fi

          python -m scut_senior_worker.corpus_builder validate \
            --candidate "${candidates[0]}"

          if [[ -n "$(find "${store_root}" -type f -name active.json -print -quit)" ]]; then
            echo "candidate validation must not generate active.json"
            exit 1
          fi

      - name: Run corpus lifecycle, contract, and fixture tests
        env:
          PYTHONPATH: apps/scut-senior/worker/src
        run: >-
          python -m pytest
          apps/scut-senior/tests/python/test_corpus_builder.py
          apps/scut-senior/tests/python/test_corpus_validator.py
          apps/scut-senior/tests/python/test_contract_assets.py

      - name: Validate the passed corpus fixture through the worker entry point
        env:
          PYTHONPATH: apps/scut-senior/worker/src
        run: >-
          python -m scut_senior_worker.corpus_validator
          --manifest apps/scut-senior/tests/fixtures/corpus/manifest.csv
          --pretty
