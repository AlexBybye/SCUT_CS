name: App CI

on:
  pull_request:
    paths:
      - "apps/scut-senior/**"
      - "tools/corpus/**"
      - ".github/workflows/**"
  push:
    branches:
      - master
    paths:
      - "apps/scut-senior/**"
      - "tools/corpus/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_LFS_SKIP_SMUDGE: "1"

jobs:
  application-tests:
    name: Application tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout@v4 makes `filter` override `sparse-checkout`; keep the
      # sequence explicit so both boundaries are active before checkout.
      - name: Partial and sparse checkout of application paths without LFS
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth=1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone -- \
            /apps/scut-senior/ \
            /tools/corpus/ \
            /.github/workflows/
          git fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          test "$(git config --bool core.sparseCheckout)" = true
          test ! -e "学科资料"
          test ! -e knowledge

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Must stay aligned with the node:22-alpine base image in
          # apps/scut-senior/Dockerfile so CI and the image build agree.
          node-version: 22
          # npm 10.9.x is implicated in hangs that surface as npm's
          # "Exit handler never called!"; npm 11 rewrote the installer with
          # faster, bounded network behavior, so pin the runner to it.
          # (The bug is still occasionally reported on 11.x, so the install
          # step below also bounds fetch timeouts and retries.)
          npm-version: 11
          cache: npm
          cache-dependency-path: apps/scut-senior/web/package-lock.json

      - name: Install web dependencies
        working-directory: apps/scut-senior/web
        shell: bash
        # npm's "Exit handler never called!" failure usually means npm died
        # while a registry fetch hung (npm's default fetch timeout is 5
        # minutes), so every plain retry burns the whole step budget. Bound
        # the network wait so npm fails fast, then retry with backoff.
        timeout-minutes: 10
        run: |
          node --version
          npm --version
          # Fail fast on a hung registry fetch instead of exhausting the
          # step timeout; retries only help if each attempt terminates.
          export npm_config_fetch_timeout=60000
          export npm_config_fetch_retries=3
          export npm_config_fetch_retry_mintimeout=2000
          export npm_config_fetch_retry_maxtimeout=20000
          if [[ -f package-lock.json ]]; then
            install_cmd=(npm ci)
          else
            install_cmd=(npm install)
          fi
          for attempt in 1 2 3 4; do
            echo "::group::${install_cmd[*]} (attempt ${attempt}/4)"
            if "${install_cmd[@]}" --no-audit --no-fund --no-progress; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            # A killed npm run can leave a half-written tree and a stale
            # cache entry; clear both before the next attempt.
            npm cache clean --force || true
            rm -rf node_modules
            sleep $((attempt * 10))
          done
          # Last resort: resolve fresh and ignore the lockfile, in case the
          # lockfile itself is what npm is choking on (out of sync with
          # package.json, or a bad resolution).
          if [[ -f package-lock.json ]]; then
            echo "::group::npm install --no-package-lock (fallback)"
            npm install --no-package-lock --no-audit --no-fund --no-progress && exit 0
            echo "::endgroup::"
          fi
          # Preserve a verbose log to diagnose the underlying cause.
          echo "::group::npm install (verbose diagnostics)"
          "${install_cmd[@]}" --no-audit --no-fund --no-progress --loglevel verbose || true
          echo "::endgroup::"
          echo "Dependency installation failed after 4 attempts."
          exit 1

      - name: Test, type-check, and build the Vue application
        working-directory: apps/scut-senior/web
        run: |
          npm run test
          npm run typecheck
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the API and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./apps/scut-senior/worker
          python -m pip install './apps/scut-senior/api[dev]'

      - name: Run Python application and contract tests
        env:
          PYTHONPATH: apps/scut-senior/api/src:apps/scut-senior/worker/src
        run: python -m pytest apps/scut-senior/tests/python

  docker-build:
    name: Application image build
    needs: application-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Partial and sparse checkout of Docker inputs without LFS
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --no-checkout --depth=1 --no-tags \
            "https://github.com/${GITHUB_REPOSITORY}.git" .
          git sparse-checkout set --no-cone -- \
            /apps/scut-senior/ \
            /.github/workflows/app-ci.yml
          git fetch --no-tags --depth=1 --filter=blob:none origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git config --get remote.origin.partialclonefilter)" = blob:none
          test "$(git config --bool core.sparseCheckout)" = true
          test ! -e "学科资料"
          test ! -e knowledge

      - name: Build the application image from the bounded context
        run: >-
          docker build
          --file apps/scut-senior/Dockerfile
          --tag scut-senior:${{ github.sha }}
          apps/scut-senior
